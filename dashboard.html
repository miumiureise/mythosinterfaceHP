<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Mythos Interface</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/dashboard.js"></script>
</head>
<body data-page="dashboard">
  <header class="site-header"><div class="site-shell"><div class="masthead"><p class="site-title"><span class="site-mark">Werkstatt</span>Mythos Interface</p><div class="language-switcher" aria-label="Language"><button type="button" data-language="ja">日本語</button><button type="button" data-language="de">Deutsch</button></div></div><nav class="main-nav" aria-label="Main navigation"><a href="index.html" data-i18n="home">Home</a><a href="apps.html" data-i18n="apps">Apps / Instrumente</a><a href="books.html" data-i18n="books">Books / Bücher</a><a href="about.html" data-i18n="about">About</a><a href="updates.html" data-i18n="updates">Updates</a><a href="dashboard.html" aria-current="page" data-i18n="dashboard">Dashboard</a></nav></div></header>
  <main class="site-shell">
    <section class="section">
      <h1 class="page-title" data-i18n="dashboard">Dashboard</h1>
      <p class="notice-board warning" data-i18n="dashboardWarning">このDashboardはGitHub Pages上の静的ページです。秘密情報や個人情報は保存しないでください。</p>
      <p data-dashboard-status aria-live="polite"></p>
    </section>
    <section class="section import-panel">
      <h2 class="section-title"><span data-i18n="import">インポート</span> / <span data-i18n="export">エクスポート</span></h2>
      <div class="action-row">
        <button type="button" class="button-link" data-export data-i18n="exportRun">JSONを書き出す</button>
        <button type="button" class="button-link button-secondary" data-reset data-i18n="resetInitial">初期公開データを再読み込み</button>
        <button type="button" class="button-link button-secondary" data-restore data-i18n="restorePrevious">直前の状態に戻す</button>
      </div>
      <fieldset>
        <legend data-i18n="importMode">インポート方法</legend>
        <div class="import-options">
          <label><input type="radio" name="import-mode" value="merge" checked> <span data-i18n="merge">統合</span></label>
          <label><input type="radio" name="import-mode" value="replace"> <span data-i18n="replace">置き換え</span></label>
          <label><input type="radio" name="import-mode" value="add"> <span data-i18n="addOnly">追加のみ</span></label>
        </div>
      </fieldset>
      <div class="action-row">
        <label class="button-link button-secondary"><span data-i18n="chooseFile">JSONファイルを選択</span><input data-import-file type="file" accept="application/json,.json" hidden></label>
        <button type="button" class="button-link" data-import-run data-i18n="importRun">読み込む</button>
      </div>
      <h3 data-i18n="importWarnings">読み込みメッセージ</h3>
      <ul data-import-warnings></ul>
    </section>
    <section class="section">
      <h2 class="section-title">Instrumenta</h2>
      <div class="dashboard-list" data-dashboard-list></div>
    </section>
  </main>
  <footer class="site-footer site-shell">Mythos Interface / Dashboard</footer>
</body>
</html>
